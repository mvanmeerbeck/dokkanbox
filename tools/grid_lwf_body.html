<!-- the sky is the page's ground, not a layer of the grid: inside #stack it painted over
     the header, because #stack is a stacking context drawn above the flow -->
<canvas id="sky"></canvas>

<div class="wrap">
  <h1>My Dokkan Box</h1>

  <!-- Six rangées de boutons occupaient tout l'écran d'un téléphone avant la première
       carte. Repliées, elles tiennent sur une ligne — qui dit ce qui est actif, sans quoi
       un panneau fermé masque une grille silencieusement restreinte. -->
  <details class="filtres">
    <summary><span class="titre">Filtres</span><span class="resume" id="fResume"></span>
      <button type="button" class="raz" id="fRaz" hidden>réinitialiser</button></summary>
    <div class="bar">
      <fieldset><legend>Colonnes · le jeu en met 5</legend><div class="row" id="cCols"></div></fieldset>
      <fieldset><legend>Rareté</legend><div class="row" id="cRare"></div></fieldset>
      <fieldset><legend>Type</legend><div class="row" id="cType"></div></fieldset>
      <fieldset><legend>Éveil maximum</legend><div class="row" id="cEv"></div></fieldset>
      <fieldset><legend>Collection</legend><div class="row" id="cOwn"></div></fieldset>
      <fieldset><legend>Chercher</legend>
        <input id="cName" type="search" placeholder="nom de la carte" autocomplete="off"></fieldset>
      <div class="stat" id="stat"></div>
    </div>
  </details>

  <div class="score" id="score"></div>
  <div class="survol" id="survol">&nbsp;</div>

  <div id="stack">
    <div class="plane" id="back"></div>
    <canvas id="auras"></canvas>
    <div class="plane" id="front"></div>
    <canvas id="pulses"></canvas>
  </div>

</div>
