<title>Ce qu'on a remonté du jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* An inventory: each piece plays, and states plainly where it came from and what is known
   about it. Nothing here is a reconstruction unless it says so. */
:root{--bg:#0C0D11;--panel:#14161B;--line:#23262E;--line2:#2E323C;
  --text:#ECEDF0;--muted:#8E939D;--faint:#5A5F69;--accent:#58A6FF;--gold:#E8B84B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Public Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.page{max-width:1000px;margin:0 auto;padding:clamp(26px,4vw,50px) clamp(14px,3vw,26px) 90px}
h1{margin:0;font-size:clamp(21px,3vw,28px);font-weight:700;letter-spacing:-.015em}
.lede{margin:9px 0 0;color:var(--muted);max-width:64ch}
h2{margin:clamp(38px,5vw,52px) 0 4px;font-size:15px;font-weight:700}
.note{margin:0 0 20px;font-size:13px;color:var(--muted);max-width:70ch}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;margin-top:20px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);
  display:flex;flex-direction:column}
.card .screen{aspect-ratio:1;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 30% 20%,#1E2130 0%,#0A0B0F 100%)}
.card canvas{display:block;max-width:100%}
.card .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:13.5px;font-weight:600}
.card .src{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);word-break:break-all}
.card dl{margin:2px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px}
.card dt{color:var(--faint)}
.card dd{margin:0;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.tag{align-self:flex-start;font-size:10.5px;border-radius:99px;padding:1px 8px;border:1px solid var(--line2);color:var(--faint)}
.tag.app{color:var(--gold);border-color:#4A3C15}
.tag.css{color:var(--accent);border-color:#1E3A5C}

table{border-collapse:collapse;margin-top:16px;font-size:13px;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{color:var(--muted);font-weight:500;font-size:12px}
td.m{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
td a{color:var(--accent);text-decoration:none}
td a:hover{text-decoration:underline}

ol.route{list-style:none;counter-reset:s;margin:18px 0 0;padding:0;max-width:680px}
ol.route li{counter-increment:s;display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
ol.route li:last-child{border-bottom:0}
ol.route li::before{content:counter(s);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);
  border:1px solid var(--line2);border-radius:50%;width:21px;height:21px;display:grid;place-items:center;flex:0 0 21px}
ol.route b{color:var(--text);font-weight:500}
.foot{margin:46px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);max-width:74ch}
.foot b{color:var(--text)}
</style>
