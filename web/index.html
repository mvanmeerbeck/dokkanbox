<meta charset="utf-8">
<!-- Sans ceci un navigateur mobile suppose une page conçue pour un écran d'ordinateur :
     il pose un viewport de mise en page de 980 px et dézoome pour le faire tenir. La grille
     est alors dessinée pour 980 px puis réduite, le ciel (fixé, large de innerWidth) n'atteint
     plus le bord droit, et tout ce qui est centré paraît décalé vers la gauche. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dokkan Box</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0C0D11;--panel:#12141A;--line:#232733;--text:#E8EAF0;--muted:#8A91A3;--gold:#E0A94A}
*{box-sizing:border-box}
/* Cards on the outer columns push their badge and their star past the frame, exactly as
   the game does — at the edge of the screen that overhang has nowhere to go, and left
   alone it makes the page scrollable sideways: everything centred then sits to the left
   with a black band on the right. Clipping the root alone is not enough, the value
   propagates to the viewport and the root itself stops clipping; body has to carry it
   too, and only does so because the root's own value is no longer `visible`. */
html{overflow-x:hidden;overflow-x:clip}
body{overflow-x:hidden;overflow-x:clip}
body{background:var(--bg);color:var(--text);margin:0;
  font:400 15px/1.65 "Public Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.86em;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:44px 26px 80px}
h1{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;padding:14px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:20px}
/* Le panneau replié doit dire ce qu'il filtre : fermé et muet, il masquerait une grille
   restreinte sans que rien ne l'indique. */
details.filtres{margin-bottom:20px}
details.filtres>summary{list-style:none;cursor:pointer;display:flex;gap:7px 11px;
  flex-wrap:wrap;align-items:baseline;
  padding:11px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  -webkit-tap-highlight-color:transparent}
details.filtres>summary::-webkit-details-marker{display:none}
details.filtres>summary::before{content:"\203A";color:var(--muted);transition:transform .15s;
  display:inline-block;align-self:center;line-height:1}
details.filtres[open]>summary::before{transform:rotate(90deg)}
details.filtres[open]>summary{border-radius:8px 8px 0 0;border-bottom:0}
details.filtres>.bar{border-radius:0 0 8px 8px;margin-bottom:0}
summary .titre{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
summary .resume{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--text)}
summary .resume.vide{color:var(--muted)}
/* Toujours là : caché tant qu'aucun filtre n'est posé, on le cherche sans le trouver. */
summary .raz{margin-left:auto;font:inherit;font-size:11.5px;padding:3px 9px;border-radius:5px;
  cursor:pointer;background:#171A22;color:var(--muted);border:1px solid var(--line)}
summary .raz:hover{color:var(--text);border-color:#39435A}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:5px;flex-wrap:wrap}
.pick{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:5px;cursor:pointer;
  background:#171A22;color:var(--muted);border:1px solid var(--line)}
.pick[aria-pressed="true"]{background:#1E2431;color:var(--text);border-color:#39435A}
/* Cent catégories ne tiennent pas en boutons : une liste déroulante, habillée comme un
   bouton. Elle passe au clair quand une catégorie est choisie, comme un bouton actif. */
.sel{max-width:200px}
.sel[data-on="1"]{background:#1E2431;color:var(--text);border-color:#39435A}
.sel option{background:var(--panel);color:var(--text)}
/* La bascule de langue : une rangée de boutons comme les filtres, mais posée sous le titre
   et toujours visible — ce n'est pas un filtre. Cachée tant qu'il n'y a qu'une langue. */
.langbar{display:flex;gap:10px;align-items:center;margin:0 0 20px}
.langbar[hidden]{display:none}   /* le display:flex ci-dessus battrait sinon l'attribut hidden */
.langbar .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat{margin-left:auto;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.stat b{color:var(--gold);font-weight:500}

/* Four planes over the same area, so a single canvas can slip between the frames and the
   artwork — which is where the auras live (z 4 against 5). The two grids share their
   template, so their cells line up exactly. */
/* Each plane needs its own stacking context, otherwise the z-index every sprite carries
   from the maquette (1..35) resolves against the ROOT context and climbs over the
   canvases, which sit at z-index auto — the aura ends up under the frames and the
   pulse under the star it is supposed to light. The tile page avoids this with
   isolation on .tile; here the four planes are numbered instead. */
/* No `isolation: isolate` here, deliberately: it makes this an opaque blend group, so the
   sky vanishes behind the grid and the additive glows stop adding to it. The planes are
   numbered instead, and each carries its own z-index — that is enough to keep the sprites'
   own z-indexes (1..35) from leaking into the root context. */
/* Android peint un rectangle bleu sur l'élément touché et laisse le doigt entamer une
   sélection ; l'un comme l'autre transparaissent par les parties transparentes de la
   carte et se lisent comme un fond bleu derrière elle. La règle existait, mais posée
   par une classe à la souris seulement : au doigt elle n'arrivait jamais, et de toute
   façon trop tard — la sélection démarre au premier contact. Rien ici n'est du texte
   à sélectionner, elle est donc permanente. preventDefault reste réservé à la souris :
   sur un écran tactile il annulerait aussi le défilement. */
#stack{position:relative;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
/* the still sky, when the build provides one: it holds the page's ground until the
   timeline is ready, and is dropped the moment the timeline draws its first frame */
body.attente{background:#05070c var(--sky) center center / cover no-repeat fixed}
.plane{display:grid;gap:4px;grid-template-columns:repeat(var(--cols,6),1fr)}
#back{position:relative;z-index:1}
#auras{z-index:2}
#front{position:absolute;inset:0;pointer-events:none;z-index:3}
#pulses{z-index:4}
/* The overlay only ever covers the viewport — sizing it to the whole grid would mean a
   17 000 pixel tall texture, worse than what it replaces. It is fixed, and the drawing is
   offset by wherever the grid currently sits. */
/* The two effect layers are anchored IN the grid, not in the window. Scrolling then moves
   them on the compositor, exactly like the cards they belong to — so a slow main thread
   makes the animations late, never misplaced. Fixed to the window they drifted visibly
   behind their tiles on a phone. The sky is the exception: in the game it does not scroll,
   so it stays glued to the window and has nothing to lag behind. */
#stack canvas{position:absolute;left:0;pointer-events:none;
  mix-blend-mode:plus-lighter}
/* outside #stack, so no cascade to fight: fixed to the window and behind everything */
#sky{position:fixed;left:0;top:0;z-index:-1;pointer-events:none}
.cell{position:relative;aspect-ratio:130/150}
/* Not owned: still legible, clearly absent. Desaturating alone reads as a rendering
   glitch; dimming alone reads as shadow. Together they read as "not yet". */
.cell.non{filter:grayscale(.9) brightness(.4) contrast(.9)}
#back .cell{cursor:pointer}
.score{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin:0 0 14px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--muted)}
.score b{font-size:22px;color:var(--text);font-weight:600}
/* A native tooltip is slow, easy to miss and not always shown; the name of the card under
   the pointer belongs in the page. */
.survol{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;
  color:var(--muted);margin:0 0 10px;min-height:1.4em}
.survol b{color:var(--text);font-weight:600}
.score .part{font-size:12px}
/* exporter / importer : des liens, pas de la navigation — le bleu par défaut
   les fait passer pour un défaut de style */
.score .lien{margin-left:auto}
.score .lien a{color:var(--gold);text-decoration:none;border-bottom:1px solid #4A3A18}
.score .lien a:hover{border-bottom-color:var(--gold)}
.score i{font-style:normal;color:var(--text)}
#cName{font:inherit;font-size:12.5px;padding:5px 9px;border-radius:5px;width:190px;
  background:#171A22;color:var(--text);border:1px solid var(--line)}
.cell img,.cell i,.cell b{position:absolute;display:block}
.cell img{object-fit:contain}
.cell i.g{background-repeat:no-repeat;background-image:var(--atlas)}
.cell.max i.g{background-image:var(--atlas-max)}
.cell b.txt{transform:skewX(-10deg);transform-origin:0 100%}
@media (max-width:560px){
  .wrap{padding:22px 10px 60px}
  h1{font-size:22px}
  .bar{padding:11px 12px;gap:13px}
  /* poussé à droite par margin-left:auto, le compteur tient sur sa propre ligne */
  .stat{margin-left:0;flex-basis:100%;text-align:left}
  .score{gap:6px 14px}
  /* poussé au bout de sa ligne, il finissait tassé contre le bord */
  .score .lien{margin-left:0}
}
</style>

<!-- the sky is the page's ground, not a layer of the grid: inside #stack it painted over
     the header, because #stack is a stacking context drawn above the flow -->
<canvas id="sky"></canvas>

<div class="wrap">
  <h1>My Dokkan Box</h1>

  <!-- Apparaît seulement quand une 2e langue de données existe (langs.json). Hors du panneau
       de filtres pour rester visible même replié : la langue n'est pas un filtre. -->
  <div class="langbar" id="langbar" hidden>
    <span class="lbl" data-i18n="language">Language</span><div class="row" id="cLang"></div>
  </div>

  <!-- Six rows of buttons filled a phone before the first card. Folded, they hold to one
       line that says what is active — a closed panel must not hide a silently cut grid.
       Every visible string carries a data-i18n key so one table can retranslate the page. -->
  <details class="filtres">
    <summary><span class="titre" data-i18n="filters">Filters</span><span class="resume" id="fResume"></span>
      <button type="button" class="raz" id="fRaz" data-i18n="clearFilters">clear filters</button></summary>
    <div class="bar">
      <fieldset><legend data-i18n="columns">Columns · the game shows 5</legend><div class="row" id="cCols"></div></fieldset>
      <fieldset><legend data-i18n="rarity">Rarity</legend><div class="row" id="cRare"></div></fieldset>
      <fieldset><legend data-i18n="type">Type</legend><div class="row" id="cType"></div></fieldset>
      <fieldset><legend data-i18n="maxAwk">Max awakening</legend><div class="row" id="cEv"></div></fieldset>
      <fieldset><legend data-i18n="category">Category</legend>
        <select id="cCat" class="pick sel"><option value="-1"></option></select></fieldset>
      <fieldset><legend data-i18n="collection">Collection</legend><div class="row" id="cOwn"></div></fieldset>
      <fieldset><legend data-i18n="search">Search</legend>
        <input id="cName" type="search" data-i18n-ph="cardNamePH" placeholder="card name" autocomplete="off"></fieldset>
      <div class="stat" id="stat"></div>
    </div>
  </details>

  <div class="score" id="score"></div>
  <div class="survol" id="survol">&nbsp;</div>

  <div id="stack">
    <div class="plane" id="back"></div>
    <canvas id="auras"></canvas>
    <div class="plane" id="front"></div>
    <canvas id="pulses"></canvas>
  </div>

</div>

        state = this._optimum[posPrev].state;
      }
      state = Base.stateUpdateChar(state);
    } else {
      state = this._optimum[posPrev].state;
    }
    if (posPrev === cur - 1) {
      if (this._optimum[cur].isShortRep()) {
        state = Base.stateUpdateShortRep(state);
      } else {
        state = Base.stateUpdateChar(state);
      }
    } else {
      var pos;
      if (this._optimum[cur].prev1IsChar && this._optimum[cur].prev2) {
        posPrev = this._optimum[cur].posPrev2;
        pos = this._optimum[cur].backPrev2;
        state = Base.stateUpdateRep(state);
      } else {
        pos = this._optimum[cur].backPrev;
        if (pos < Base.kNumRepDistances) {
          state = Base.stateUpdateRep(state);
        } else {
          state = Base.stateUpdateMatch(state);
        }
      }

      var opt = this._optimum[posPrev];
      if (pos < Base.kNumRepDistances) {
        if (pos === 0) {
          this.reps[0] = opt.backs0;
          this.reps[1] = opt.backs1;
          this.reps[2] = opt.backs2;
          this.reps[3] = opt.backs3;
        } else if (pos === 1) {
          this.reps[0] = opt.backs1;
          this.reps[1] = opt.backs0;
          this.reps[2] = opt.backs2;
          this.reps[3] = opt.backs3;
        } else if (pos === 2) {
          this.reps[0] = opt.backs2;
          this.reps[1] = opt.backs0;
          this.reps[2] = opt.backs1;
          this.reps[3] = opt.backs3;
        } else {
          this.reps[0] = opt.backs3;
          this.reps[1] = opt.backs0;
          this.reps[2] = opt.backs1;
          this.reps[3] = opt.backs2;
        }
      } else {
        this.reps[0] = pos - Base.kNumRepDistances;
        this.reps[1] = opt.backs0;
        this.reps[2] = opt.backs1;
        this.reps[3] = opt.backs2;
      }
    }
    this._optimum[cur].state = state;
    this._optimum[cur].backs0 = this.reps[0];
    this._optimum[cur].backs1 = this.reps[1];
    this._optimum[cur].backs2 = this.reps[2];
    this._optimum[cur].backs3 = this.reps[3];
    var curPrice = this._optimum[cur].price;

    currentByte = this._matchFinder.getIndexByte(-1);
    matchByte = this._matchFinder.getIndexByte(-this.reps[0] - 2);
    posState = position & this._posStateMask;

    var curAnd1Price = curPrice +
      RangeCoder.Encoder.getPrice0(this._isMatch[(state << Base.kNumPosStatesBitsMax) + posState]) +
      this._literalEncoder.getSubCoder(position, this._matchFinder.getIndexByte(-2)).
      getPrice(!Base.stateIsCharState(state), matchByte, currentByte);

    var nextOptimum = this._optimum[cur + 1];

    var nextIsChar = false;
    if (curAnd1Price < nextOptimum.price) {
      nextOptimum.price = curAnd1Price;
      nextOptimum.posPrev = cur;
      nextOptimum.makeAsChar();
      nextIsChar = true;
    }

    matchPrice = curPrice + RangeCoder.Encoder.getPrice1(this._isMatch[(state << Base.kNumPosStatesBitsMax) + posState]);
    repMatchPrice = matchPrice + RangeCoder.Encoder.getPrice1(this._isRep[state]);

    if (matchByte === currentByte &&
        !(nextOptimum.posPrev < cur && nextOptimum.backPrev === 0)) {
      var shortRepPrice2 =
        repMatchPrice + this.getRepLen1Price(state, posState);
      if (shortRepPrice2 <= nextOptimum.price) {
        nextOptimum.price = shortRepPrice2;
        nextOptimum.posPrev = cur;
        nextOptimum.makeAsShortRep();
        nextIsChar = true;
      }
    }

    var numAvailableBytesFull = this._matchFinder.getNumAvailableBytes() + 1;
    numAvailableBytesFull = Math.min(kNumOpts - 1 - cur, numAvailableBytesFull);
    numAvailableBytes = numAvailableBytesFull;

    if (numAvailableBytes < 2) {
      continue;
    }
    if (numAvailableBytes > this._numFastBytes) {
      numAvailableBytes = this._numFastBytes;
    }
    if (!nextIsChar && matchByte !== currentByte) {
      // Try Literal + rep0
      var t = Math.min(numAvailableBytesFull - 1, this._numFastBytes);
      var lenTest2 = this._matchFinder.getMatchLen(0, this.reps[0], t);
      if (lenTest2 >= 2) {
        var state2 = Base.stateUpdateChar(state);

        var posStateNext = (position + 1) & this._posStateMask;
        var nextRepMatchPrice = curAnd1Price +
          RangeCoder.Encoder.getPrice1(this._isMatch[(state2 << Base.kNumPosStatesBitsMax) + posStateNext]) +
          RangeCoder.Encoder.getPrice1(this._isRep[state2]);

        var offset = cur + 1 + lenTest2;
        while (lenEnd < offset) {
          this._optimum[++lenEnd].price = kInfinityPrice;
        }
        var curAndLenPrice3 = nextRepMatchPrice + this.getRepPrice(0, lenTest2, state2, posStateNext);
        var optimum3 = this._optimum[offset];
        if (curAndLenPrice3 < optimum3.price) {
          optimum3.price = curAndLenPrice3;
          optimum3.posPrev = cur + 1;
          optimum3.backPrev = 0;
          optimum3.prev1IsChar = true;
          optimum3.prev2 = false;
        }
      }
    }

    var startLen = 2;	// Speed optimization

    var repIndex;
    for (repIndex = 0; repIndex < Base.kNumRepDistances; repIndex++) {
      var lenTest = this._matchFinder.getMatchLen(-1, this.reps[repIndex], numAvailableBytes);
      if (lenTest < 2) {
        continue;
      }
      var lenTestTemp = lenTest;
      do {
        while (lenEnd < cur + lenTest) {
          this._optimum[++lenEnd].price = kInfinityPrice;
        }
        var curAndLenPrice4 = repMatchPrice + this.getRepPrice(repIndex, lenTest, state, posState);
        var optimum4 = this._optimum[cur + lenTest];
        if (curAndLenPrice4 < optimum4.price) {
          optimum4.price = curAndLenPrice4;
          optimum4.posPrev = cur;
          optimum4.backPrev = repIndex;
          optimum4.prev1IsChar = false;
        }
      } while (--lenTest >= 2);
      lenTest = lenTestTemp;

      if (repIndex === 0) {
        startLen = lenTest + 1;
      }

      // if (_maxMode)
      if (lenTest < numAvailableBytesFull) {
        var t5 = Math.min(numAvailableBytesFull - 1 - lenTest, this._numFastBytes);
        var lenTest25 = this._matchFinder.getMatchLen(lenTest, this.reps[repIndex], t5);
        if (lenTest25 >= 2) {
          var state25 = Base.stateUpdateRep(state);
          var posStateNext5 = (position + lenTest) & this._posStateMask;
          var curAndLenCharPrice = repMatchPrice +
            this.getRepPrice(repIndex, lenTest, state, posState) +
            RangeCoder.Encoder.getPrice0(this._isMatch[(state25 << Base.kNumPosStatesBitsMax) + posStateNext5]) +
            this._literalEncoder.getSubCoder(position + lenTest,
                                             this._matchFinder.getIndexByte(lenTest - 2)).
            getPrice(true,
                     this._matchFinder.getIndexByte(lenTest - 1 - (this.reps[repIndex] + 1)),
                     this._matchFinder.getIndexByte(lenTest - 1));

          state25 = Base.stateUpdateChar(state25);
          posStateNext5 = (position + lenTest + 1) & this._posStateMask;
          var nextMatchPrice5 = curAndLenCharPrice +
            RangeCoder.Encoder.getPrice1(this._isMatch[(state25 << Base.kNumPosStatesBitsMax) + posStateNext5]);
          var nextRepMatchPrice5 = nextMatchPrice5 +
            RangeCoder.Encoder.getPrice1(this._isRep[state25]);

          // for(; lenTest2 >= 2; lenTest2--) {
          var offset5 = lenTest + 1 + lenTest25;
          while (lenEnd < cur + offset5) {
            this._optimum[++lenEnd].price = kInfinityPrice;
          }
          var curAndLenPrice5 = nextRepMatchPrice5 +
            this.getRepPrice(0, lenTest25, state25, posStateNext5);
          var optimum5 = this._optimum[cur + offset5];
          if (curAndLenPrice5 < optimum5.price) {
            optimum5.price = curAndLenPrice5;
            optimum5.posPrev = cur + lenTest + 1;
            optimum5.backPrev = 0;
            optimum5.prev1IsChar = true;
            optimum5.prev2 = true;
            optimum5.posPrev2 = cur;
            optimum5.backPrev2 = repIndex;
          }
        }
      }
    }

    if (newLen > numAvailableBytes) {
      newLen = numAvailableBytes;
      numDistancePairs = 0;
      while(newLen > this._matchDistances[numDistancePairs]) {
        numDistancePairs += 2;
      }
      this._matchDistances[numDistancePairs] = newLen;
      numDistancePairs += 2;
    }
    if (newLen >= startLen) {
      normalMatchPrice = matchPrice +
        RangeCoder.Encoder.getPrice0(this._isRep[state]);
      while (lenEnd < cur + newLen) {
        this._optimum[++lenEnd].price = kInfinityPrice;
      }

      var offs6 = 0;
      while (startLen > this._matchDistances[offs6]) {
        offs6 += 2;
      }

      var lenTest6;
      for (lenTest6 = startLen; ; lenTest6++) {
        var curBack = this._matchDistances[offs6 + 1];
        var curAndLenPrice6 = normalMatchPrice +
          this.getPosLenPrice(curBack, lenTest6, posState);
        var optimum6 = this._optimum[cur + lenTest6];
        if (curAndLenPrice6 < optimum6.price) {
          optimum6.price = curAndLenPrice6;
          optimum6.posPrev = cur;
          optimum6.backPrev = curBack + Base.kNumRepDistances;
          optimum6.prev1IsChar = false;
        }

        if (lenTest6 === this._matchDistances[offs6]) {
          if (lenTest6 < numAvailableBytesFull) {
            var t7 = Math.min(numAvailableBytesFull - 1 - lenTest6,
                              this._numFastBytes);
            var lenTest27 = this._matchFinder.getMatchLen(lenTest6, curBack, t7);
            if (lenTest27 >= 2) {
              var state27 = Base.stateUpdateMatch(state);

              var posStateNext7 = (position + lenTest6) & this._posStateMask;
              var curAndLenCharPrice7 = curAndLenPrice6 +
                RangeCoder.Encoder.getPrice0(this._isMatch[(state27 << Base.kNumPosStatesBitsMax) + posStateNext7]) +
                this._literalEncoder.getSubCoder(position + lenTest6,
                                                 this._matchFinder.getIndexByte(lenTest6 - 2)).
                getPrice(true,
                         this._matchFinder.getIndexByte(lenTest6 - (curBack + 1) -1),
                         this._matchFinder.getIndexByte(lenTest6 - 1));
              state27 = Base.stateUpdateChar(state27);
              posStateNext7 = (position + lenTest6 + 1) & this._posStateMask;
              var nextMatchPrice7 = curAndLenCharPrice7 +
                RangeCoder.Encoder.getPrice1(this._isMatch[(state27 << Base.kNumPosStatesBitsMax) + posStateNext7]);
              var nextRepMatchPrice7 = nextMatchPrice7 +
                RangeCoder.Encoder.getPrice1(this._isRep[state27]);

              var offset7 = lenTest6 + 1 + lenTest27;
              while (lenEnd < cur + offset7) {
                this._optimum[++lenEnd].price = kInfinityPrice;
              }
              var curAndLenPrice7 = nextRepMatchPrice7 +
                this.getRepPrice(0, lenTest27, state27, posStateNext7);
              var optimum7 = this._optimum[cur + offset7];
              if (curAndLenPrice7 < optimum7.price) {
                optimum7.price = curAndLenPrice7;
                optimum7.posPrev = cur + lenTest6 + 1;
                optimum7.backPrev = 0;
                optimum7.prev1IsChar = true;
                optimum7.prev2 = true;
                optimum7.posPrev2 = cur;
                optimum7.backPrev2 = curBack + Base.kNumRepDistances;
              }
            }
          }
          offs6 += 2;
          if (offs6 === numDistancePairs) {
            break;
          }
        }
      }
    }
  }
};

Encoder.prototype.changePair = function(smallDist, bigDist) {
  var kDif = 7;
  return (smallDist < (1 << (32 - kDif)) && bigDist >= (smallDist << kDif));
};

Encoder.prototype.writeEndMarker = function(posState) {
  if (!this._writeEndMark) {
    return;
  }

  this._rangeEncoder.encode(this._isMatch, (this._state << Base.kNumPosStatesBitsMax) + posState, 1);
  this._rangeEncoder.encode(this._isRep, this._state, 0);
  this._state = Base.stateUpdateMatch(this._state);
  var len = Base.kMatchMinLen;
  this._lenEncoder.encode(this._rangeEncoder, len - Base.kMatchMinLen, posState);
  var posSlot = (1 << Base.kNumPosSlotBits) - 1;
  var lenToPosState = Base.getLenToPosState(len);
  this._posSlotEncoder[lenToPosState].encode(this._rangeEncoder, posSlot);
  var footerBits = 30;
  var posReduced = (1 << footerBits) - 1;
  this._rangeEncoder.encodeDirectBits(posReduced >> Base.kNumAlignBits,
                                      footerBits - Base.kNumAlignBits);
  this._posAlignEncoder.reverseEncode(this._rangeEncoder,
                                      posReduced & Base.kAlignMask);
};

Encoder.prototype.flush = function(nowPos) {
  this.releaseMFStream();
  this.writeEndMarker(nowPos & this._posStateMask);
  this._rangeEncoder.flushData();
  this._rangeEncoder.flushStream();
};

Encoder.prototype.codeOneBlock = function(inSize, outSize, finished) {
  inSize[0] = 0;
  outSize[0] = 0;
  finished[0] = true;

  if (this._inStream) {
    this._matchFinder.setStream(this._inStream);
    this._matchFinder.init();
    this._needReleaseMFStream = true;
    this._inStream = null;
  }

  if (this._finished) {
    return;
  }
  this._finished = true;

  var progressPosValuePrev = this.nowPos64;
  var posState, curByte, i;

  if (this.nowPos64 === 0) {
    if (this._matchFinder.getNumAvailableBytes() === 0) {
      this.flush(this.nowPos64);
      return;
    }

    this.readMatchDistances();
    posState = this.nowPos64 & this._posStateMask;
    this._rangeEncoder.encode(this._isMatch, (this._state << Base.kNumPosStatesBitsMax) + posState, 0);
    this._state = Base.stateUpdateChar(this._state);
    curByte = this._matchFinder.getIndexByte(0 - this._additionalOffset);
    this._literalEncoder.getSubCoder(this.nowPos64, this._previousByte).
      encode(this._rangeEncoder, curByte);
    this._previousByte = curByte;
    this._additionalOffset--;
    this.nowPos64++;
  }
  if (this._matchFinder.getNumAvailableBytes() === 0) {
    this.flush(this.nowPos64);
    return;
  }
  while (true) {
    var len = this.getOptimum(this.nowPos64);
    var pos = this.backRes;
    posState = this.nowPos64 & this._posStateMask;
    var complexState = (this._state << Base.kNumPosStatesBitsMax) + posState;
    if (len === 1 && pos === -1) {
      this._rangeEncoder.encode(this._isMatch, complexState, 0);
      curByte = this._matchFinder.getIndexByte(- this._additionalOffset);
      var subCoder = this._literalEncoder.getSubCoder(this.nowPos64,
                                                      this._previousByte);
      if (!Base.stateIsCharState(this._state)) {
        var matchByte = this._matchFinder.getIndexByte(- this._repDistances[0] - 1 - this._additionalOffset);
        subCoder.encodeMatched(this._rangeEncoder, matchByte, curByte);
      } else {
        subCoder.encode(this._rangeEncoder, curByte);
      }
      this._previousByte = curByte;
      this._state = Base.stateUpdateChar(this._state);
    } else {
      this._rangeEncoder.encode(this._isMatch, complexState, 1);
      if (pos < Base.kNumRepDistances) {
        this._rangeEncoder.encode(this._isRep, this._state, 1);
        if (pos === 0) {
          this._rangeEncoder.encode(this._isRepG0, this._state, 0);
          if (len === 1) {
            this._rangeEncoder.encode(this._isRep0Long, complexState, 0);
          } else {
            this._rangeEncoder.encode(this._isRep0Long, complexState, 1);
          }
        } else {
          this._rangeEncoder.encode(this._isRepG0, this._state, 1);
          if (pos === 1) {
            this._rangeEncoder.encode(this._isRepG1, this._state, 0);
          } else {
            this._rangeEncoder.encode(this._isRepG1, this._state, 1);
            this._rangeEncoder.encode(this._isRepG2, this._state, pos - 2);
          }
        }
        if (len === 1) {
          this._state = Base.stateUpdateShortRep(this._state);
        } else {
          this._repMatchLenEncoder.encode(this._rangeEncoder,
                                          len - Base.kMatchMinLen, posState);
          this._state = Base.stateUpdateRep(this._state);
        }
        var distance = this._repDistances[pos];
        if (pos !== 0) {
          for (i = pos; i >= 1; i--) {
            this._repDistances[i] = this._repDistances[i - 1];
          }
          this._repDistances[0] = distance;
        }
      } else {
        this._rangeEncoder.encode(this._isRep, this._state, 0);
        this._state = Base.stateUpdateMatch(this._state);
        this._lenEncoder.encode(this._rangeEncoder, len - Base.kMatchMinLen,
                                posState);
        pos -= Base.kNumRepDistances;
        var posSlot = getPosSlot(pos);
        var lenToPosState = Base.getLenToPosState(len);
        this._posSlotEncoder[lenToPosState].encode(this._rangeEncoder, posSlot);

        if (posSlot >= Base.kStartPosModelIndex) {
          var footerBits = ((posSlot >>> 1) - 1);
          var baseVal = ((2 | (posSlot & 1)) << footerBits);
          var posReduced = pos - baseVal;

          if (posSlot < Base.kEndPosModelIndex) {
            RangeCoder.BitTreeEncoder.reverseEncode(this._posEncoders,
                                                    baseVal - posSlot - 1,
                                                    this._rangeEncoder,
                                                    footerBits, posReduced);
          } else {
            this._rangeEncoder.encodeDirectBits(posReduced >> Base.kNumAlignBits, footerBits - Base.kNumAlignBits);
            this._posAlignEncoder.reverseEncode(this._rangeEncoder,
                                                posReduced & Base.kAlignMask);
            this._alignPriceCount++;
          }
        }
        var distance2 = pos;
        for (i = Base.kNumRepDistances - 1; i >= 1; i--) {
          this._repDistances[i] = this._repDistances[i - 1];
        }
        this._repDistances[0] = distance2;
        this._matchPriceCount++;
      }
      this._previousByte =
        this._matchFinder.getIndexByte(len - 1 - this._additionalOffset);
    }
    this._additionalOffset -= len;
    this.nowPos64 += len;
    if (this._additionalOffset === 0) {
      // if (!_fastMode)
      if (this._matchPriceCount >= (1 << 7)) {
        this.fillDistancesPrices();
      }
      if (this._alignPriceCount >= Base.kAlignTableSize) {
        this.fillAlignPrices();
      }
      inSize[0] = this.nowPos64;
      outSize[0] = this._rangeEncoder.getProcessedSizeAdd();

      if (this._matchFinder.getNumAvailableBytes() === 0) {
        this.flush(this.nowPos64);
        return;
      }

      if (this.nowPos64 - progressPosValuePrev >= (1 << 12)) {
        this._finished = false;
        finished[0] = false;
        return;
      }
    }
  }
};

Encoder.prototype.releaseMFStream = function() {
  if (this._matchFinder && this._needReleaseMFStream) {
    this._matchFinder.releaseStream();
    this._needReleaseMFStream = false;
  }
};

Encoder.prototype.setOutStream = function(outStream) {
  this._rangeEncoder.setStream(outStream);
};
Encoder.prototype.releaseOutStream = function() {
  this._rangeEncoder.releaseStream();
};

Encoder.prototype.releaseStreams = function() {
  this.releaseMFStream();
  this.releaseOutStream();
};

Encoder.prototype.setStreams = function(inStream, outStream, inSize, outSize) {
  this._inStream = inStream;
  this._finished = false;
  this.create();
  this.setOutStream(outStream);
  this.init();

  // if (!_fastMode)
  if (true) {
    this.fillDistancesPrices();
    this.fillAlignPrices();
  }

  this._lenEncoder.setTableSize(this._numFastBytes + 1 - Base.kMatchMinLen);
  this._lenEncoder.updateTables(1 << this._posStateBits);
  this._repMatchLenEncoder.setTableSize(this._numFastBytes +
                                        1 - Base.kMatchMinLen);
  this._repMatchLenEncoder.updateTables(1 << this._posStateBits);

  this.nowPos64 = 0;
};

Encoder.prototype.code = function(inStream, outStream, inSize, outSize, progress) {
  this._needReleaseMFStream = false;
  try {
    this.setStreams(inStream, outStream, inSize, outSize);
    while (true) {

      this.codeOneBlock(this.processedInSize, this.processedOutSize,
                        this.finished);
      if (this.finished[0]) {
        return;
      }
      if (progress) {
        progress.setProgress(this.processedInSize[0], this.processedOutSize[0]);
      }
    }
  } finally {
    this.releaseStreams();
  }
};

Encoder.prototype.writeCoderProperties = function(outStream) {
  var properties = makeBuffer(kPropSize), i;
  properties[0] = ((this._posStateBits * 5 + this._numLiteralPosStateBits) * 9+
                   this._numLiteralContextBits);
  for (i = 0; i < 4; i++) {
    properties[1 + i] = (this._dictionarySize >>> (8 * i));
  }
  for (i = 0; i< kPropSize; i++) {
    outStream.writeByte(properties[i]);
  }
};

Encoder.prototype.fillDistancesPrices = function() {
  var tempPrices = [];
  tempPrices.length = Base.kNumFullDistances;
  var i, posSlot;
  for (i = Base.kStartPosModelIndex; i < Base.kNumFullDistances; i++) {
    posSlot = getPosSlot(i);
    var footerBits = ((posSlot >>> 1) - 1);
    var baseVal = ((2 | (posSlot & 1)) << footerBits);
    tempPrices[i] =
      RangeCoder.BitTreeEncoder.reverseGetPrice(this._posEncoders,
                                                baseVal - posSlot - 1,
                                                footerBits, i - baseVal);
  }

  var lenToPosState = 0;
  for ( ; lenToPosState < Base.kNumLenToPosStates; lenToPosState++) {
    var encoder = this._posSlotEncoder[lenToPosState];

    var st = (lenToPosState << Base.kNumPosSlotBits);
    for (posSlot = 0; posSlot < this._distTableSize; posSlot++) {
      this._posSlotPrices[st + posSlot] = encoder.getPrice(posSlot);
    }
    for (posSlot = Base.kEndPosModelIndex; posSlot < this._distTableSize; posSlot++) {
      this._posSlotPrices[st + posSlot] += ((((posSlot >>> 1) - 1) - Base.kNumAlignBits) << RangeCoder.Encoder.kNumBitPriceShiftBits);
    }

    var st2 = lenToPosState * Base.kNumFullDistances;
    for (i = 0; i < Base.kStartPosModelIndex; i++) {
      this._distancesPrices[st2 + i] = this._posSlotPrices[st + i];
    }
    for (; i < Base.kNumFullDistances; i++) {
      this._distancesPrices[st2 + i] =
        this._posSlotPrices[st + getPosSlot(i)] + tempPrices[i];
    }
  }
  this._matchPriceCount = 0;
};

Encoder.prototype.fillAlignPrices = function() {
  var i;
  for (i = 0; i < Base.kAlignTableSize; i++) {
    this._alignPrices[i] = this._posAlignEncoder.reverseGetPrice(i);
  }
  this._alignPriceCount = 0;
};

Encoder.prototype.setAlgorithm = function(algorithm) {
  /*
    _fastMode = (algorithm == 0);
    _maxMode = (algorithm >= 2);
  */
  return true;
};

Encoder.prototype.setDictionarySize = function(dictionarySize) {
  var kDicLogSizeMaxCompress = 29;
  if (dictionarySize < (1 << Base.kDicLogSizeMin) ||
      dictionarySize > (1 << kDicLogSizeMaxCompress)) {
    return false;
  }
  this._dictionarySize = dictionarySize;
  var dicLogSize = 0;
  while (dictionarySize > (1 << dicLogSize)) {
    dicLogSize++;
  }
  this._distTableSize = dicLogSize * 2;
  return true;
};

Encoder.prototype.setNumFastBytes = function(numFastBytes) {
  if (numFastBytes < 5 || numFastBytes > Base.kMatchMaxLen) {
    return false;
  }
  this._numFastBytes = numFastBytes;
  return true;
};

Encoder.prototype.setMatchFinder = function(matchFinderIndex) {
  if (matchFinderIndex < 0 || matchFinderIndex > 2) {
    return false;
  }
  var matchFinderIndexPrev = this._matchFinderType;
  this._matchFinderType = matchFinderIndex;
  if (this._matchFinder && matchFinderIndexPrev != this._matchFinderType) {
    this._dictionarySizePrev = -1;
    this._matchFinder = null;
  }
  return true;
};

Encoder.prototype.setLcLpPb = function(lc, lp, pb) {
  if (lp < 0 || lp > Base.kNumLitPosStatesBitsEncodingMax ||
      lc < 0 || lc > Base.kNumLitContextBitsMax ||
      pb < 0 || pb > Base.kNumPosStatesBitsEncodingMax) {
    return false;
  }
  this._numLiteralPosStateBits = lp;
  this._numLiteralContextBits = lc;
  this._posStateBits = pb;
  this._posStateMask = ((1) << this._posStateBits) - 1;

  try { possede = new Set(JSON.parse(localStorage.getItem(CLE) || "[]")); } catch (e) {}
  let sauveEnAttente = 0;
  function sauver() {
    clearTimeout(sauveEnAttente);
    sauveEnAttente = setTimeout(() => {
      try { localStorage.setItem(CLE, JSON.stringify([...possede])); } catch (e) {}
    }, 400);                       /* painting a row must not write a thousand times */
  }
  let live = [];          // {kind, col, row} for every animated tile

  function place(el, node, nat) {
    const n = N[node], s = n.scale || 1, dw = nat[0] * s, dh = nat[1] * s;
    el.style.left = pc(n.x + n.w / 2 - dw / 2, W);
    el.style.top = pc(H - (n.y + n.h / 2) - dh / 2, H);
    el.style.width = pc(dw, W); el.style.height = pc(dh, H);
    el.style.zIndex = n.z;
  }
  /* `loading` has to be set BEFORE `src`: assigning src starts the fetch, and an
     attribute added afterwards arrives too late to defer anything. */
  function sprite(cell, node, src, nat, lazy) {
    const e = document.createElement("img");
    /* a card thumbnail can wait; the shared chrome and the timelines cannot */
    if (lazy) { e.loading = "lazy"; e.fetchPriority = "low"; }
    e.src = src; e.alt = ""; place(e, node, nat); cell.appendChild(e); return e;
  }
  function text(cell, node, str) {
    const n = N[node], sc = n.scale || 1, kern = n.kerning || 0, lh = FONT.lineHeight;
    let lw = 0;
    for (const ch of str) { const g = FONT.glyphs[ch.codePointAt(0)]; if (g) lw += g[6] + kern; }
    const ay = 0.5 + sc * (n.h - lh) / (2 * lh);
    const box = document.createElement("b");
    box.className = "txt";
    box.style.left = pc((n.x + n.w / 2) - lw * sc / 2, W);
    box.style.top = pc(H - ((n.y + 3 + n.h / 2) - lh * ay * sc + lh * sc), H);
    box.style.width = pc(lw * sc, W); box.style.height = pc(lh * sc, H);
    box.style.zIndex = n.z;
    let pen = 0;
    for (const ch of str) {
      const g = FONT.glyphs[ch.codePointAt(0)];
      if (!g) continue;
      if (g[2] && g[3]) {
        const i = document.createElement("i");
        i.className = "g";
        i.style.left = (pen + g[4]) / lw * 100 + "%";
        i.style.top = g[5] / lh * 100 + "%";
        i.style.width = g[2] / lw * 100 + "%";
        i.style.height = g[3] / lh * 100 + "%";
        i.style.backgroundSize = (FONT.atlasW / g[2] * 100) + "% " + (FONT.atlasH / g[3] * 100) + "%";
        i.style.backgroundPosition = (g[0] / (FONT.atlasW - g[2]) * 100) + "% " +
                                     (g[1] / (FONT.atlasH - g[3]) * 100) + "%";
        box.appendChild(i);
      }
      pen += g[6] + kern;
    }
    box.setAttribute("role", "img"); box.setAttribute("aria-label", str);
    cell.appendChild(box);
  }

  function paint() {
    const t0 = performance.now();
    back.style.setProperty("--cols", state.cols);
    front.style.setProperty("--cols", state.cols);
    const q = state.nom.trim().toLowerCase();
    const shown = CARDS.filter(c =>
      (state.rare < 0 || c.rarity === state.rare) &&
      (state.type < 0 || c.element % 10 === state.type) &&
      (state.ev < 0 || c.ev === state.ev) &&
      (state.cat < 0 || c.cats.includes(state.cat)) &&
      (state.own === "tous" || (state.own === "oui") === possede.has(c.top)) &&
      (!q || nomC(c).toLowerCase().includes(q)));
    back.textContent = ""; front.textContent = "";
    drawnEl = null;              /* the stat line is rebuilt below; the old node is gone */
    const fb = document.createDocumentFragment(), ff = document.createDocumentFragment();
    live = [];
    shown.forEach((card, idx) => {
      const type = card.element % 10, rare = Math.min(card.rarity, 3);
      const a = possede.has(card.top);
      const b = document.createElement("div");
      b.className = a ? "cell" : "cell non";
      b.dataset.id = card.top; b.dataset.i = idx;
      /* the tooltip has to live on the plane that receives the pointer: #front is
         pointer-events:none, so a title there is never shown */
      b.title = nomC(card) + " · " + RARE[card.rarity].toUpperCase() + " · " + t().lv + " " + card.lv +
                " · " + card.top;
      sprite(b, "img_bg", IMG.bg[type + "_" + rare], NAT.bg);
      fb.appendChild(b);

      const f = document.createElement("div");
      /* Each card shows what it is, not what the demonstration wants: the level turns
         yellow at the cap, the big star marks an awakened form, the Extreme Z aura belongs
         to the cards that have one, and the LR lightning to the LR alone. */
      f.className = "cell max" + (a ? "" : " non");
      sprite(f, "image_thumb", THUMB[card.id], [250, 250], true);
      sprite(f, "image_chara_bottom_base", IMG.band[String(type)], NAT.band);
      sprite(f, "image_rare_ssr", IMG.rare[RARE[card.rarity]], NAT.rare);
      /* Only the big star. In the game's own box the awakened tile carries that one and
         nothing else; the row of small stars beside it says the same thing twice. */
      if (card.awk) sprite(f, "image_star_evo_big", IMG.star["5"], NAT.star["5"]);
      sprite(f, "image_label_lv", LOCA().label, LOCA().natLabel);
      text(f, "font_num", String(card.lv));
      sprite(f, "image_icon_type", LOCA().type[String(card.element)], LOCA().natType);
      ff.appendChild(f);

      const col = idx % state.cols, row = (idx / state.cols) | 0;
      /* the game plays fla_bg_effect on LR alone; the demonstration puts it everywhere,
         so the three timelines can be judged on the same card */
      if (a) live.push(...anims(card, col, row));
    });
    affichees = shown;
    back.appendChild(fb); front.appendChild(ff);
    compter();
    resize();
    const ms = Math.round(performance.now() - t0);
    document.getElementById("stat").innerHTML =
      "<b>" + shown.length + "</b> " + t().cards + " · <b>" + live.length +
      "</b> " + t().animated + " · <b id='drawn'>0</b> " + t().onScreen +
      " · " + t().builtIn + " <b>" + ms + " ms</b> · <b id='fps'>—</b>";
  }

  /* ---- one instance per timeline, rendered once and copied everywhere ---- */
  const PLAY = {};
  let cell = { w: 0, h: 0, x: 0, y: 0, gap: 4 };
  let affichees = [];                   /* the cards currently laid out, in grid order */

  function resize() {
    const r = back.getBoundingClientRect();
    cell.gap = 4;
    cell.w = (r.width - cell.gap * (state.cols - 1)) / state.cols;
    cell.h = cell.w * H / W;
    /* full bleed: the game's sky reaches every edge of the screen, so it is sized on the
       window and not on the grid, which the page insets by its own padding */
    fit(cSky, innerWidth, innerHeight);
    /* two screens of band at most, and never past the texture cap */
    band.h = Math.max(innerHeight, Math.min(innerHeight * 2, Math.floor(CAP / dpr())));
    /* The effect layer reaches past the grid so a star on an edge card is not cut — but
       only as far as the window allows. Wider than the window and the page becomes
       scrollable sideways, which shifts everything centred to the left and leaves a
       black band on the right. The room available is the page's own margin. */
    const libre = Math.min(r.left, document.documentElement.clientWidth - r.right);
    band.x = Math.max(0, Math.min(Math.round(cell.w * 0.6), Math.floor(libre)));
    for (const c of [cAur, cPul]) {
      bandD = fit(c, r.width + band.x * 2, band.h);
      c.style.left = -band.x + "px";
    }
    band.top = null;
    fitSky();
    fitPlays();
  }

  /* Each timeline renders into its own little canvas, once, and that image is blitted to
     every tile that needs it. Rendering it larger than a tile is pure waste: at twelve
     columns a tile is 90 px and a fixed 400 px canvas throws away eight ninths of the
     work. Sized to what is actually shown, never above the old ceiling. */
  function fitPlays() {
    const d = dpr();
    for (const k in PLAY) {
      const p = PLAY[k];
      if (!p) continue;
      const px = Math.max(48, Math.min(p.span * 2, Math.round(p.span / W * cell.w * d)));
      if (px === p.px) continue;
      p.px = px;
      p.canvas.width = p.canvas.height = px;
      const r = px / p.span;
      p.lwf.rootMovie.moveTo(px / 2, px / 2);
      p.lwf.rootMovie.scaleTo(r, r);
    }
  }

  /* The game draws this timeline over its whole 852 x 1136 design area, edge to edge. A
     browser window is any shape, so it is scaled to cover it and centred on it — never on
     the canvas, which only covers the slice of window the grid occupies. The sky never
     tiles: the maquette gives it no repeat, and it does not need one. */
  function fitSky() {
    if (!sky) return;
    const s = Math.max(cSky.width / 852, cSky.height / 1136);
    sky.rootMovie.moveTo(cSky.width / 2, cSky.height / 2);
    sky.rootMovie.scaleTo(s, s);
  }
  /* No scroll handler: the overlays are fixed, so scrolling moves nothing about them —
     only the grid slides underneath, and tick() reads that offset once per frame.
     Resizing the canvas would reallocate its buffer on every scroll event. */
  addEventListener("resize", resize);

  const cSky = document.getElementById("sky");
  const gAur = cAur.getContext("2d"), gPul = cPul.getContext("2d");
  let sky = null;                       /* the outgame timeline, drawn straight into #sky */

  /* A phone reports 3 device pixels per CSS pixel; at that rate the sky alone is some
     3,6 million pixels redrawn every frame. These are soft glows over a blurred starfield
     — 1,5 is indistinguishable and a quarter of the work. */
  const dpr = () => Math.min(devicePixelRatio || 1, 1.5);
  /* Past a few thousand pixels a side, a mobile GPU cannot hold the canvas as a texture and
     the browser silently falls back to software rasterising — measured on a phone: a band
     of three screens made one canvas 11,5 Mpx and the frame took SIX SECONDS. Nothing is
     ever allowed to cross this. */
  const CAP = 2048;

  function fit(c, wCss, hCss) {
    const d = Math.max(0.5, Math.min(dpr(), CAP / wCss, CAP / hCss));
    c.style.width = wCss + "px";
    c.style.height = hCss + "px";
    c.width = Math.max(1, Math.round(wCss * d));
    c.height = Math.max(1, Math.round(hCss * d));
    return d;
  }
  let bandD = 1;
  /* the effect layers cover three screens and are only moved when the window drifts out */
  /* The effects overflow their tile — the star sticks out to the right of the last column
     and to the left of the first — so the layer is wider than the grid on both sides. */
  const band = { top: null, h: 0, x: 0 };
  let drawnEl = null;

  /* LWF timelines are authored at 30 images a second: running them at the display's rate
     doubles the work and shows nothing more. The blit to the overlays still happens every
     frame, so scrolling stays smooth. */
  /* ---- diagnostic, on ?debug ----------------------------------------------
     Guessing at a phone from a desktop does not work. This panel makes the page say
     where its time goes, and lets each layer be switched off one at a time — the only
     way to find out which one costs, on the machine that is actually slow. */
  const DBG = /[?&]debug\b/.test(location.search);
  const off = { sky: false, auras: false, pulses: false };
  const acc = { sky: 0, play: 0, blit: 0, all: 0, gap: 0, n: 0 };
  let dbgEl = null;
  if (DBG) {
    dbgEl = document.createElement("div");
    dbgEl.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:9;padding:8px 10px;" +
      "background:rgba(6,8,12,.88);border:1px solid #2A3040;border-radius:7px;" +
      "font:11.5px/1.5 ui-monospace,monospace;color:#D6D9E0;white-space:pre;";
    document.body.appendChild(dbgEl);
    dbgEl.addEventListener("click", e => {
      const k = e.target.getAttribute && e.target.getAttribute("data-k");
      if (!k) return;
      off[k] = !off[k];
      const c = k === "sky" ? cSky : k === "auras" ? cAur : cPul;
      c.style.visibility = off[k] ? "hidden" : "";
    });
  }

  if (DBG) setInterval(() => {
    if (!acc.n) return;
    const d = dpr();
    const mpx = c => (c.width * c.height / 1e6).toFixed(2);
    const box = (k, l) => "<span data-k='" + k + "' style='cursor:pointer;padding:1px 5px;" +
      "border:1px solid #39435A;border-radius:4px;background:" +
      (off[k] ? "#3A2430" : "#1E2431") + "'>" + l + (off[k] ? " ✕" : "") + "</span>";
    dbgEl.innerHTML =
      Math.round(1000 / (acc.gap / acc.n)) + " i/s · " +
      (acc.all / acc.n).toFixed(2) + " ms de js par image\n" +
      "  ciel   " + (acc.sky / acc.n).toFixed(2) + " ms\n" +
      "  anims  " + (acc.play / acc.n).toFixed(2) + " ms\n" +
      "  report " + (acc.blit / acc.n).toFixed(2) + " ms · " + (acc.drawn || 0) + " vignettes\n" +
      "  canevas " + mpx(cSky) + " + " + mpx(cAur) + " + " + mpx(cPul) + " Mpx · dpr " +
      (devicePixelRatio || 1) + " plafonne a " + d.toFixed(2) + "\n  " +
      box("sky", "ciel") + " " + box("auras", "auras") + " " + box("pulses", "pulsations");
    acc.sky = acc.play = acc.blit = acc.all = acc.gap = acc.n = 0;
  }, 600);

  const STEP = 1 / 30;
  let prev = 0, skyAcc = 0, skyDone = false;
  let used = null;                    /* which timelines a visible tile actually needs */

  function tick(now) {
    const dt = prev ? Math.min((now - prev) / 1000, 0.1) : 0;
    const gap = prev ? now - prev : 0;
    prev = now;
    const t0 = DBG ? performance.now() : 0;
    /* the sky covers the whole window, so it is the one that costs: half rate again */
    if (sky && !off.sky) {
      skyAcc += dt;
      if (skyAcc >= STEP * 2) {
        sky.exec(skyAcc); sky.render(); skyAcc = 0;
        /* the still sky held the place while the timeline loaded; now that the timeline
           is drawing, drop it — two starfields at once read as a doubled grid */
        if (!skyDone) { skyDone = true; document.body.classList.remove("attente"); }
      }
    }
    const t1 = DBG ? performance.now() : 0;
    for (const k in PLAY) {
      const p = PLAY[k];
      if (!p || (used && !used[k])) continue;     /* nothing on screen needs this one */
      p.acc = (p.acc || 0) + dt;
      if (p.acc >= STEP) { p.lwf.exec(p.acc); p.lwf.render(); p.acc = 0; }
    }
    const t2 = DBG ? performance.now() : 0;
    const d = bandD;
    const seen = {};

    /* one layout read per frame, then pure arithmetic for every tile */
    const gr = back.getBoundingClientRect();
    const view = -gr.top;                       /* how far into the grid the window is */
    /* the band is centred on the window, so the margin either side is what is left over —
       and it is moved only once the window has eaten most of that margin */
    const margin = (band.h - innerHeight) / 2;
    const want = Math.max(0, Math.min(view - margin, back.scrollHeight - band.h));
    if (band.top === null || Math.abs(want - band.top) > margin * 0.6) {
      band.top = want;
      cAur.style.top = cPul.style.top = want + "px";
    }
    /* clear only the slice that can be seen, not three screens of canvas */
    const y0 = Math.max(0, view - band.top - 300);
    const y1 = Math.min(band.h, view - band.top + innerHeight + 300);
    for (const g of [gAur, gPul]) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, y0 * d, g.canvas.width, (y1 - y0) * d);
      g.globalCompositeOperation = "lighter";
    }
    let drawn = 0;
    for (const it of live) {
      const p = PLAY[it.k];
      if (!p) continue;
      const tx = it.col * (cell.w + cell.gap) + band.x;
      const ty = it.row * (cell.h + cell.gap) - band.top;
      if (ty + cell.h < y0 || ty > y1) continue;
      if (off.auras && it.k !== "pulse") continue;
      if (off.pulses && it.k === "pulse") continue;
      const g = it.k === "pulse" ? gPul : gAur;
      seen[it.k] = true;
      const s = p.span;
      g.drawImage(p.canvas,
        (tx + (p.ox - s / 2) / W * cell.w) * d, (ty + (H - p.oy - s / 2) / H * cell.h) * d,
        s / W * cell.w * d, s / H * cell.h * d);
      drawn++;
    }
    used = seen;
    if (DBG) {
      const t3 = performance.now();
      acc.sky += t1 - t0; acc.play += t2 - t1; acc.blit += t3 - t2;
      acc.all += t3 - t0; acc.gap += gap; acc.n++; acc.drawn = drawn;
    }
    drawnEl = drawnEl || document.getElementById("drawn");
    if (drawnEl && drawnEl.__n !== drawn) { drawnEl.textContent = drawn; drawnEl.__n = drawn; }
    requestAnimationFrame(tick);
  }

  /* ---- the player, fed from the payload ---------------------------------- */
  /* Embedded, the timelines arrive as base64 and the player is fed through a fake XHR.
     Served, each one is a folder of real files and the player fetches them itself — so the
     interception is installed only when there is something to intercept. */
  const EMBEDDED = Object.values(ANIM).some(a => a.lwf);
  const open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
  if (EMBEDDED) {
  XMLHttpRequest.prototype.open = function (m, u) {
    this.__lwf = String(u).indexOf(".lwf") !== -1; this.__url = String(u);
    return this.__lwf ? undefined : open.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    if (!this.__lwf) return send.apply(this, arguments);
    const key = this.__url.replace(/^.*\//, "").replace(/#.*$/, "").replace(/\.lwf$/, "");
    const bin = atob(ANIM[key].lwf), b = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    const self = this;
    setTimeout(() => {
      for (const [k, v] of [["readyState", 4], ["status", 200], ["response", b.buffer]])
        Object.defineProperty(self, k, { value: v, configurable: true });
      if (self.onreadystatechange) self.onreadystatechange();
    }, 0);
  };
  }

  /* The player asks for its textures by the name the timeline carries. Embedded, that name
     maps to a data: URI; served, to a file — which is not even the same extension, since
     the textures go out as lossless WebP. One table either way. */
  const BANK = {};
  for (const k of Object.keys(ANIM)) Object.assign(BANK, ANIM[k].img || {});
  const desc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  Object.defineProperty(HTMLImageElement.prototype, "src", {
    configurable: true,
    get() { return desc.get.call(this); },
    set(v) {
      const k = Object.keys(BANK).find(n => String(v).indexOf(n) !== -1);
      desc.set.call(this, k ? BANK[k] : v);
    }
  });

  /* where the player should look for one timeline, whichever way it was built */
  const at = file => (ANIM[file] && ANIM[file].dir) || "./";

  LWF.useCanvasRenderer();
  const big = N.image_star_evo_big;
  const soe = N.fla_super_optimal_eff;
  const WANT = [
    ["lr_aura", "icon_rare_20000", "ef_001", N.fla_bg_effect.x, N.fla_bg_effect.y, 144],
    ["pulse", "icon_rare_20000", "ef_002", big.x + big.w / 2 + 15, big.y + big.h / 2, 120]
  ];
  /* The super Z awakening aura is not one animation but five: the controller formats
     "ef_{0:03d}" with (type % 10) + 1, so AGI gets ef_001 and END ef_005. Playing ef_001
     for every card painted the whole grid cyan. Five shared instances, one per type. */
  for (let t = 0; t < 5; t++)
    WANT.push(["seza_" + t, "super_optimal_eff", "ef_00" + (t + 1), soe.x, soe.y, 200]);
  /* anim_120000 is the outgame sky itself: z 2 of the same maquette whose z 1 is
     com_bg.png. It carries the grid, the starfield, the drifting nebula, the twinkles
     (bg_matataki) and the cyan ball that crosses (bg_ball). */
  LWF.ResourceCache.get().loadLWF({
    lwf: "anim_120000.lwf#sky", prefix: at("anim_120000"), worker: false, stage: cSky,
    onload: lwf => {
      if (!lwf) return;
      lwf.rendererFactory.clearColor = null;
      sky = lwf;
      lwf.rootMovie.attachMovie("ef_001", "m");
      fitSky();
    }
  });

  let pending = WANT.length;
  for (const [key, file, anime, ox, oy, span] of WANT) {
    /* The stage must keep its default size while LWF initialises — the renderer reads it
       to work out its own scale — and be resized in onload, the way the tile page does it.
       Sizing it beforehand shrank the effect to almost nothing behind the star. */
    const R = 2, cv = document.createElement("canvas");
    LWF.ResourceCache.get().loadLWF({
      lwf: file + ".lwf#" + key, prefix: at(file), worker: false, stage: cv,
      onload: lwf => {
        if (lwf) {
          lwf.rendererFactory.clearColor = null;
          cv.width = cv.height = span * R;
          lwf.rootMovie.moveTo(span * R / 2, span * R / 2);
          lwf.rootMovie.scaleTo(R, R);
          lwf.rootMovie.attachMovie(anime, "m");
          PLAY[key] = { lwf, canvas: cv, ox, oy, span, px: span * R };
          fitPlays();
        }
        if (--pending === 0) requestAnimationFrame(tick);
      }
    });
  }

  /* A label may be a string or a function: functions are re-read on every sync, so a
     language switch relabels every button without rebuilding the group. The count of
     buttons never changes with the language, so the DOM is built once. */
  function group(id, items, get, set) {
    const host = document.getElementById(id);
    const made = items.map(it => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "pick";
      b.addEventListener("click", () => { set(it.value); sync(); });
      host.appendChild(b);
      return [b, it.value, it.label];
    });
    return () => made.forEach(([b, v, label]) => {
      b.textContent = typeof label === "function" ? label() : label;
      b.setAttribute("aria-pressed", String(get() === v));
    });
  }
  const syncs = [
    group("cCols", [5, 10, 25].map(n => ({ label: String(n), value: n })), () => state.cols, v => state.cols = v),
    group("cRare", [{ label: () => t().allF, value: -1 }].concat(RARE.map((r, i) => ({ label: r.toUpperCase(), value: i }))),
          () => state.rare, v => state.rare = v),
    group("cType", [{ label: () => t().all, value: -1 }].concat(
            [0, 1, 2, 3, 4].map(i => ({ label: () => types()[i], value: i }))),
          () => state.type, v => state.type = v),
    group("cEv", [{ label: () => t().all, value: -1 },
                  { label: () => t().ev[4], value: 4 }, { label: () => t().ev[3], value: 3 },
                  { label: () => t().ev[2], value: 2 }, { label: () => t().ev[1], value: 1 },
                  { label: () => t().ev[0], value: 0 }],
          () => state.ev, v => state.ev = v),
    group("cOwn", [{ label: () => t().allF, value: "tous" }, { label: () => t().owned, value: "oui" },
                   { label: () => t().missing, value: "non" }],
          () => state.own, v => state.own = v)
  ];
  {
    const champ = document.getElementById("cName");
    let attente = 0;
    champ.addEventListener("input", () => {
      clearTimeout(attente);
      attente = setTimeout(() => { state.nom = champ.value; resume(); paint(); }, 180);
    });
  }
  const catSel = document.getElementById("cCat");
  /* (Re)build the menu in the current language, sorted by name so a known category is found
     by scanning, not by hunting an id order. Rebuilt on a language switch, selection kept. */
  function remplirCat() {
    const garde = catSel.value;
    catSel.length = 1; catSel.options[0].textContent = t().allF;   /* keep "all", relabel it, drop the rest */
    Object.keys(CATS).map(id => [id, nomCat(id)])
      .sort((a, b) => a[1].localeCompare(b[1]))
      .forEach(([id, nom]) => {
        const o = document.createElement("option");
        o.value = id; o.textContent = nom; catSel.appendChild(o);
      });
    catSel.value = garde;
  }
  remplirCat();
  catSel.addEventListener("change", () => {
    state.cat = +catSel.value;
    catSel.dataset.on = state.cat < 0 ? "0" : "1";
    resume(); paint();
  });
  /* What a tile animates, in one place: the render lists them for every owned card, and a
     click adds or removes exactly these. Keeping two copies of the rule is how a card ends
     up drawn as owned but still dark until the page is reloaded. */
  function anims(card, col, row) {
    const out = [];
    const awk = !!card.awk, eza = !!card.eza;
    if (card.rarity === 5) out.push({ k: "lr_aura", col, row });
    if (eza) out.push({ k: "seza_" + (card.element % 10), col, row });
    if (awk && card.rarity >= 4) out.push({ k: "pulse", col, row });
    return out;
  }

  function compter() {
    const par = {}, tot = {};
    for (const c of CARDS) {
      tot[c.rarity] = (tot[c.rarity] || 0) + 1;
      if (possede.has(c.top)) par[c.rarity] = (par[c.rarity] || 0) + 1;
    }
    const parts = RARE.map((r, i) => tot[i]
      ? `<span class="part">${r.toUpperCase()} <i>${par[i] || 0}</i>/${tot[i]}</span>` : "")
      .reverse().join("");
    document.getElementById("score").innerHTML =
      `<span><b>${possede.size}</b> / ${CARDS.length}</span>` + parts +
      `<span class="part lien">` +
      `<a href="#" id="exp">${t().export}</a> · <a href="#" id="imp">${t().import}</a>` +
      ` · <a href="#" id="vider">${t().clearAll}</a></span>`;
    document.getElementById("exp").onclick = e => {
      e.preventDefault();
      const b = new Blob([JSON.stringify([...possede])], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = "ma-collection.json"; a.click();
    };
    document.getElementById("imp").onclick = e => {
      e.preventDefault();
      const i = document.createElement("input");
      i.type = "file"; i.accept = "application/json";
      i.onchange = () => i.files[0].text().then(txt => {   /* not `t`: that shadows the i18n helper */
        try { possede = new Set(JSON.parse(txt)); sauver(); sync(); } catch (err) {}
      });
      i.click();
    };
    /* Des centaines de cases cochées à la main, effaçables d'un doigt et sans retour :
       c'est le seul geste de la page qui mérite qu'on demande confirmation. */
    document.getElementById("vider").onclick = e => {
      e.preventDefault();
      if (!possede.size) return;
      if (!confirm(t().confirmClear(possede.size))) return;
      possede.clear(); sauver(); sync();
    };
  }

  /* ---- click to toggle, drag to paint -------------------------------------
     Five hundred clicks to enter a box is a chore; painting a row in one gesture is not.
     The value is decided on the first card touched and applied to every card the pointer
     crosses, the way a spreadsheet fills cells. Mouse only: on a touch screen the same
     gesture is how you scroll. */
  let peint = null;
  function marquer(el) {
    const id = el && el.dataset && +el.dataset.id;
    if (!id || peint === null) return;
    if (possede.has(id) === peint) return;
    peint ? possede.add(id) : possede.delete(id);
    const i = +el.dataset.i;              /* the rank is written once, at build time */
    for (const plane of [back, front]) {
      const cell = plane.children[i];
      if (cell) cell.classList.toggle("non", !peint);
    }
    const col = i % state.cols, row = (i / state.cols) | 0;
    live = live.filter(t => !(t.col === col && t.row === row));
    if (peint && affichees[i]) live.push(...anims(affichees[i], col, row));
    sauver(); compter();
  }
  /* toggle one cell, whatever it currently is */
  function basculer(cell) {
    peint = !possede.has(+cell.dataset.id);
    marquer(cell);
    peint = null;
  }
  /* A tap toggles, a scroll does not — and the browser already tells the two apart: it fires
     `click` for a real tap (mouse or finger) and swallows it the instant a touch turns into a
     scroll, with per-platform thresholds. So we key the single toggle on `click` rather than
     guess a pixel distance ourselves. A mouse drag paints a row; the trailing click is then
     swallowed so the first card is not flipped twice. */
  let origine = null, aPeint = false;
  back.addEventListener("click", e => {
    if (aPeint) { aPeint = false; return; }   /* a mouse drag already handled these cards */
    const cell = e.target.closest(".cell");
    if (cell) basculer(cell);
  });
  back.addEventListener("pointerdown", e => {
    /* touch: let the click decide, so scroll is free. Clear the paint flag so a mouse drag
       that ended off the grid, leaving it set, cannot swallow this tap. */
    if (e.pointerType !== "mouse") { aPeint = false; return; }
    const cell = e.target.closest(".cell");
    if (!cell) return;
    origine = cell; peint = null; aPeint = false;
    e.preventDefault();                        /* no text selection while dragging */
  });
  const survolEl = document.getElementById("survol");
  back.addEventListener("pointermove", e => {
    const cell = e.target.closest(".cell");
    if (cell && survolEl) {
      const card = affichees[+cell.dataset.i];
      if (card) survolEl.innerHTML =
        "<b>" + nomC(card) + "</b> · " + RARE[card.rarity].toUpperCase() +
        " · " + t().lv + " " + card.lv + " · " + types()[card.element % 10] +
        " · " + t().awakening + " " + t().ev[card.ev] +
        " · <span style='opacity:.6'>" + card.top + "</span>";
    }
    /* drag-to-paint, mouse only: the value is fixed from the first card and applied to every
       card the pointer crosses, the origin included */
    if (e.pointerType !== "mouse" || !e.buttons || !origine || !cell) return;
    if (peint === null) { peint = !possede.has(+origine.dataset.id); marquer(origine); aPeint = true; }
    marquer(cell);
  });
  back.addEventListener("pointerleave", () => { if (survolEl) survolEl.innerHTML = "&nbsp;"; });
  addEventListener("pointerup", () => { peint = null; origine = null; });

  /* Ce que le panneau replié annonce. Sans cela un filtre laissé actif se traduit par une
     grille amputée dont plus rien ne dit pourquoi. */
  const resumeEl = document.getElementById("fResume");
  const razEl = document.getElementById("fRaz");
  function resume() {
    const p = [];
    if (state.cols !== 5) p.push(state.cols + " " + t().columnsWord);
    if (state.rare >= 0) p.push(RARE[state.rare].toUpperCase());
    if (state.type >= 0) p.push(types()[state.type]);
    if (state.ev >= 0) p.push(t().ev[state.ev]);
    if (state.cat >= 0) p.push(nomCat(state.cat));
    if (state.own !== "tous") p.push(state.own === "oui" ? t().owned : t().missing);
    if (state.nom) p.push("« " + state.nom + " »");
    resumeEl.textContent = p.length ? p.join(" · ") : t().allCards;
    resumeEl.classList.toggle("vide", !p.length);
  }
  razEl.addEventListener("click", e => {
    /* le bouton est dans le summary : sans cela le clic replierait aussi le panneau */
    e.preventDefault(); e.stopPropagation();
    state.cols = 5; state.rare = state.type = state.ev = state.cat = -1;
    state.own = "tous"; state.nom = "";
    document.getElementById("cName").value = "";
    catSel.value = "-1"; catSel.dataset.on = "0";
    sync();
  });

  /* The language buttons exist only when a second base has been added — with one language
     there is nothing to switch, so the bar stays hidden. Switching retranslates the whole
     page: static chrome (appliquerTextes), the filter buttons and the summary (sync relabels
     them from their label functions), the category menu, and the tiles' names and badges
     (paint, called by sync). The choice is remembered. */
  function majLangBtns() {
    document.querySelectorAll("#cLang .pick").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  }
  function changerLangue(l) {
    if (!LANGS.includes(l) || l === lang) return;
    lang = l;
    try { localStorage.setItem(CLE_LANG, l); } catch (e) {}
    appliquerTextes(); remplirCat(); majLangBtns(); sync();
  }
  {
    const bar = document.getElementById("langbar");
    if (LANGS.length > 1 && bar) {
      bar.hidden = false;
      const host = document.getElementById("cLang");
      LANGS.forEach(l => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "pick"; b.textContent = l.toUpperCase();
        b.dataset.l = l;
        b.addEventListener("click", () => changerLangue(l));
        host.appendChild(b);
      });
      majLangBtns();
    }
  }

  function sync() { syncs.forEach(f => f()); resume(); paint(); }

  /* a frame counter, so the claim is checkable rather than asserted */
  let frames = 0, mark = performance.now();
  setInterval(() => {
    const el = document.getElementById("fps"), dt = (performance.now() - mark) / 1000;
    /* headless captures advance virtual time without ever painting: report nothing
       rather than a rate of zero that would only be an artefact of the capture */
    if (el && frames > 4) el.textContent = Math.round(frames / dt) + " i/s";
    frames = 0; mark = performance.now();
  }, 1000);
  const raf = requestAnimationFrame;
  requestAnimationFrame = function (f) { return raf(t => { frames++; f(t); }); };

  if (IMG.sky) {
    document.documentElement.style.setProperty("--sky", "url(" + IMG.sky + ")");
    document.body.classList.add("attente");
  }
  document.documentElement.style.setProperty("--atlas", "url(" + IMG.atlas + ")");
  document.documentElement.style.setProperty("--atlas-max", "url(" + IMG.atlasMax + ")");
  appliquerTextes();               /* the static chrome, in the current language, before first paint */
  sync();
})();
</script>
