<!doctype html><meta charset="utf-8"><title>Menu Dokkan</title>
<style>
  html,body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070c}
  .footer{position:relative;width:min(852px,100vw);aspect-ratio:852/151;overflow:hidden}
  .footer>*{position:absolute}
  .lbl{display:flex;align-items:center;justify-content:center;color:#fff;
    font:800 clamp(9px,1.7vw,15px)/1 "Arial Narrow",Arial,sans-serif;
    letter-spacing:.02em;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
</style>
<div class="footer" id="f">
  <img id="bg" src="footer/com_foo_base.png" alt="" style="left:0.0000%;top:56.2914%;width:100.0000%;height:211.9205%">
  <div class="lbl" style="left:11.6197%;top:72.1854%;width:14.7887%;height:23.8411%">ACCUEIL</div>
  <div class="lbl" style="left:26.9953%;top:72.1854%;width:14.7887%;height:23.8411%">ÉQUIPE</div>
  <div class="lbl" style="left:42.2535%;top:72.1854%;width:14.7887%;height:23.8411%">INVOCATION</div>
  <div class="lbl" style="left:57.5117%;top:72.1854%;width:14.7887%;height:23.8411%">MAGASIN</div>
  <div class="lbl" style="left:72.6526%;top:72.1854%;width:14.7887%;height:23.8411%">ÉCHANGE</div>
</div>
<script src="footer/lwf.js"></script>
<script>
LWF.useCanvasRenderer();
const BTN=[{"ef": "ef_006", "left": 12.2066, "top": 1.9868, "wpc": 17.6056, "hpc": 99.3377}, {"ef": "ef_002", "left": 27.4648, "top": 1.9868, "wpc": 17.6056, "hpc": 99.3377}, {"ef": "ef_003", "left": 42.723, "top": 1.9868, "wpc": 17.6056, "hpc": 99.3377}, {"ef": "ef_004", "left": 57.8638, "top": 1.9868, "wpc": 17.6056, "hpc": 99.3377}, {"ef": "ef_005", "left": 73.2394, "top": 1.9868, "wpc": 17.6056, "hpc": 99.3377}];
const R=2, insts=[], f=document.getElementById('f');
for(const b of BTN){
  const cv=document.createElement('canvas'); cv.width=cv.height=150*R;
  cv.style.cssText='position:absolute;left:'+b.left+'%;top:'+b.top+'%;width:'+b.wpc+'%;height:'+b.hpc+'%';
  f.appendChild(cv);
  LWF.ResourceCache.get().loadLWF({lwf:'globalnavi_btn.lwf',prefix:'footer/',worker:false,stage:cv,
    onload:lwf=>{ if(!lwf)return; lwf.rendererFactory.clearColor=null;
      lwf.rootMovie.moveTo(150*R/2,150*R/2); lwf.rootMovie.scaleTo(R,R);
      lwf.rootMovie.attachMovie(b.ef,'m'); lwf.exec(0); lwf.render(); insts.push(lwf); }});
}
let prev=performance.now();
(function tick(now){ let dt=(now-prev)/1000; prev=now; if(!(dt>0)||dt>0.1) dt=1/60;
  for(const l of insts){ l.exec(dt); l.render(); } requestAnimationFrame(tick); })(prev);
</script>
